# MATLAB Tests - NatureOS
# Runs when MATLAB is available (MathWorks-hosted runner or self-hosted with license).
# Skipped by default on ubuntu-latest; enable when MATLAB license is configured.

name: matlab-tests

on:
  push:
    branches: [main]
    paths:
      - 'matlab/**'
      - 'tests/matlab/**'
  pull_request:
    branches: [main]
    paths:
      - 'matlab/**'
      - 'tests/matlab/**'
  workflow_dispatch:

jobs:
  matlab-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify MATLAB scripts exist
        run: |
          test -d matlab/preprocessing || exit 1
          test -d matlab/models || exit 1
          test -d matlab/lab || exit 1
          test -d matlab/hardware || exit 1
          echo "MATLAB script structure validated"

      # Uncomment when MATLAB license is available for CI:
      # - uses: matlab-actions/setup-matlab@v2
      # - uses: matlab-actions/run-tests@v2
      #   with:
      #     select-by-folder: tests/matlab

name: Validate and Package NatureOS

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x
    
    - name: Restore dependencies
      run: dotnet restore src/core-api/NatureOS.CoreApi.csproj
    
    - name: Build
      run: dotnet build src/core-api/NatureOS.CoreApi.csproj --no-restore --configuration Release
    
    - name: Test
      run: dotnet test src/core-api/NatureOS.CoreApi.csproj --no-build --configuration Release --verbosity normal
    
    - name: Publish
      run: dotnet publish src/core-api/NatureOS.CoreApi.csproj --no-build --configuration Release --output ./publish
    
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: natureos-app
        path: ./publish


  # Deployment is separate from CI and requires a reviewed operator handoff.
  # This workflow never logs into Azure or invokes production auto-fix endpoints.

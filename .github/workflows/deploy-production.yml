name: Deploy to Production

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  id-token: write
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x
    
    - name: Restore dependencies
      run: dotnet restore src/core-api/NatureOS.CoreApi.csproj
    
    - name: Build
      run: dotnet build src/core-api/NatureOS.CoreApi.csproj --no-restore --configuration Release
    
    - name: Test
      run: dotnet test src/core-api/NatureOS.CoreApi.csproj --no-build --configuration Release --verbosity normal
    
    - name: Publish
      run: dotnet publish src/core-api/NatureOS.CoreApi.csproj --no-build --configuration Release --output ./publish
    
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: natureos-app
        path: ./publish

  deploy:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    environment: production
    
    steps:
    - name: Download artifact
      uses: actions/download-artifact@v4
      with:
        name: natureos-app
        path: ./publish
    
    - name: Azure Login
      uses: azure/login@v2
      with:
        client-id: ${{ secrets.AZURE_CLIENT_ID }}
        tenant-id: ${{ secrets.AZURE_TENANT_ID }}
        subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
    
    - name: Deploy to Azure Web App
      uses: azure/webapps-deploy@v3
      with:
        app-name: 'natureos-api-prod001'
        slot-name: 'production'
        package: ./publish
    
    - name: Azure logout
      run: |
        az logout
        az cache purge
        az account clear 